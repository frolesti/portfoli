name: Ressenyes - Prova al propi correu

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-review-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Test review moderation
        run: node --test scripts/test-reviews.cjs

      - name: Send test only to the sender
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: node newsletter/scripts/send-review-test.js