name: Ressenyes - Enviar invitacions aprovades

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Escriu ENVIAR per contactar nomes AESSO i Anna d'Alta
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: send-review-invitations
  cancel-in-progress: false

jobs:
  send-invitations:
    if: github.event.inputs.confirmation == 'ENVIAR'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Test reviews
        run: node --test scripts/test-reviews.cjs
      - name: Send the two approved invitations
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: node newsletter/scripts/send-review-invitations.js --send