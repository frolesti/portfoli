<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deixa el teu comentari · frolesti</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, var(--client-bg-1, #eef4f1) 0%, #f9f6f2 48%, var(--client-bg-2, #efe7f4) 100%);
    }
    .client-review-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 16px;
    }
    .client-review-shell {
      width: min(760px, 100%);
      background: rgba(255,255,255,0.78);
      border: 1px solid rgba(0,0,0,0.06);
      border-radius: 28px;
      box-shadow: 0 20px 60px rgba(20, 30, 50, 0.12);
      padding: 34px;
      backdrop-filter: blur(12px);
    }
    .client-review-eyebrow {
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-dim);
      margin-bottom: 10px;
    }
    .client-review-title {
      font-family: var(--font-heading);
      font-weight: 400;
      font-size: clamp(1.75rem, 3.5vw, 2.85rem);
      margin: 0 0 12px;
      line-height: 1.25;
    }
    .client-review-lead {
      color: var(--text-muted);
      line-height: 1.6;
      margin: 0 0 28px;
      max-width: 60ch;
    }
    .client-review-note {
      padding: 14px;
      border-radius: 16px;
      background: color-mix(in srgb, var(--client-accent, #2a7a6e) 10%, white);
      margin-bottom: 20px;
      color: var(--text-main);
      line-height: 1.5;
      border: 1px solid color-mix(in srgb, var(--client-accent, #2a7a6e) 26%, white);
      display: grid;
      grid-template-columns: minmax(96px, 150px) 1fr;
      gap: 14px;
      align-items: center;
    }
    .client-review-logo-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 58px;
    }
    .client-review-logo {
      width: 100%;
      max-width: 142px;
      max-height: 48px;
      object-fit: contain;
      display: block;
      margin: 0 auto;
    }
    .client-review-error {
      padding: 12px 14px;
      border-radius: 16px;
      background: rgba(220, 53, 69, 0.08);
      color: #a23434;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .client-review-brand {
      display: grid;
      gap: 4px;
    }
    .client-review-brand strong {
      font-size: 1rem;
    }
    .client-review-brand span {
      color: var(--text-muted);
      font-size: 0.92rem;
    }
    .client-review-brand a {
      color: var(--client-accent, var(--accent-1));
      font-weight: 600;
      text-underline-offset: 2px;
      text-decoration-thickness: 2px;
    }
    .client-review-brand a:hover {
      opacity: 0.88;
    }
    @media (max-width: 740px) {
      .client-review-shell {
        padding: 24px 18px;
      }
      .client-review-note {
        grid-template-columns: 1fr;
        gap: 8px;
      }
      .client-review-logo-wrap {
        justify-content: flex-start;
        min-height: 50px;
      }
      .client-review-logo {
        margin: 0;
        max-width: 148px;
      }
    }
    @media (max-width: 600px) {
      .client-review-shell { padding: 18px 14px; border-radius: 18px; }
      .client-review-title { font-size: clamp(1.5rem, 8vw, 2rem); }
      .client-review-lead { margin-bottom: 18px; }
      .review-form .form-group textarea { min-height: 140px; }
    }
  </style>
</head>
<body>
  <main class="client-review-page">
    <div class="client-review-shell">
      <div class="client-review-eyebrow">Ressenya del client</div>
      <h1 class="client-review-title" id="clientReviewTitle">Deixa el teu comentari</h1>
      <p class="client-review-lead" id="clientReviewLead">Comparteix en una frase com ha anat la col·laboració i jo m'encarrego de la resta.</p>

      <div id="clientReviewContext"></div>
      <div id="clientReviewError" class="client-review-error" hidden></div>

      <form class="review-form" id="clientReviewForm" hidden>
        <div class="form-group">
          <label for="rv-name">Nom del o la representant</label>
          <input type="text" id="rv-name" name="name" placeholder="Nom i cognoms" maxlength="80" autocomplete="name" required>
        </div>
        <div class="form-group">
          <label for="rv-message">Ressenya</label>
          <textarea id="rv-message" name="message" rows="6" placeholder="Escriu aquí el comentari que vols compartir..." required maxlength="1000"></textarea>
        </div>
        <input type="hidden" id="rv-company-id" name="companyId" value="">
        <input type="hidden" id="rv-company-name" name="companyName" value="">
        <input type="hidden" id="rv-client-token" name="clientToken" value="">
        <div class="review-form-footer">
          <button type="submit" class="btn btn-primary">Enviar comentari</button>
        </div>
        <p class="review-form-status" id="clientReviewStatus" hidden></p>
      </form>
    </div>
  </main>

  <script src="assets/client-review.js" defer></script>
</body>
</html>
